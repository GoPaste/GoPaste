<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .field { position: absolute; inset: 0; }
  .cell { position: absolute; width: 30px; height: 30px; }
  .cell svg { width: 30px; height: 30px; stroke-width: 1.75; }
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 34% 40% at 50% 50%, rgba(20,22,28,0.96) 0%, rgba(20,22,28,0.85) 45%, rgba(20,22,28,0) 100%); }
  .lockup { position: absolute; left: 0; right: 0; top: 380px; display: flex; flex-direction: column; align-items: center; }
  .lockup .wordmark { font-size: 132px; color: #f3f5fa; }
  .lockup .sub { margin-top: 30px; font-size: 32px; font-weight: 500; color: var(--text-2); letter-spacing: 0.16em; }
  .label { position: absolute; left: 60px; bottom: 44px; font: 500 20px var(--mono); color: #4b5263; letter-spacing: .12em; }
</style></head>
<body><div class="stage">
  <div class="field" id="field"></div>
  <div class="vignette"></div>
  <div class="lockup">
    <div class="wordmark"><img src="../../build/appicon.png">GoPaste</div>
    <div class="sub">轻量 · 快速 · 安全的剪贴板管理工具</div>
  </div>
  <div class="label">SF-01 · 品牌开场 · icon-field-colorize · ≈ 2.6s</div>
  <div class="grain"></div>
</div>
<script>
  // 确定性：mulberry32 哈希，seed 由格子索引派生
  const rnd = (s) => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
  const set = ['file-text', 'image', 'link', 'code-xml', 'file', 'star', 'pin', 'search', 'clipboard', 'smile']
  const field = document.getElementById('field')
  const P = 84, cols = 24, rows = 14, ox = (1920 - (cols - 1) * P) / 2 - 15, oy = (1080 - (rows - 1) * P) / 2 - 15
  const R = 760 // 上色波前半径（px），styleframe 定格在 "约 70% 已上色"
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c, x = ox + c * P, y = oy + r * P
    const d = Math.hypot(x + 15 - 960, (y + 15 - 540) * 1.25)
    const el = document.createElement('div'); el.className = 'cell'
    el.style.left = x + 'px'; el.style.top = y + 'px'
    el.innerHTML = ICONS[set[Math.floor(rnd(i * 7 + 3) * set.length)]]
    const lit = d < R, edge = Math.max(0, 1 - Math.abs(d - R) / 90)
    el.style.color = lit ? '#3b82f6' : '#2a2f3a'
    el.style.opacity = lit ? (0.35 + 0.45 * rnd(i) + 0.4 * edge).toFixed(2) : (0.7 + 0.3 * rnd(i)).toFixed(2)
    if (edge > 0.6 && lit) el.style.filter = 'drop-shadow(0 0 6px rgba(59,130,246,.7))'
    field.appendChild(el)
  }
</script>
</body></html>
