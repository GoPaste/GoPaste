changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "✨ 新功能"
      labels:
        - feat
        - feature
        - enhancement
    - title: "🐛 Bug 修复"
      labels:
        - fix
        - bug
        - bugfix
    - title: "⚡ 性能优化"
      labels:
        - perf
        - performance
    - title: "📦 构建 & CI"
      labels:
        - ci
        - build
        - chore
    - title: "📝 文档"
      labels:
        - docs
        - documentation
    - title: "其他变更"
      labels:
        - "*"
