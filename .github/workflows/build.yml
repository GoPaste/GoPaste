name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===================================================================
  # create-release: 提前创建（或重建）空 Release，供各 build job 直接上传。
  # 只在 tag push 时运行；workflow_dispatch 时跳过（无 tag，无需 release）。
  # ===================================================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing Release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true

      - name: Create empty Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES_FILE="changelog/release_notes_v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "" \
              --draft=false
          fi

  build:
    # tag push 时等待 release 创建完成；workflow_dispatch 时直接运行
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== macOS =====
          - id: mac-arm64
            os: macos-latest
            platform: darwin/arm64
            task: darwin:package ARCH=arm64
            output: GoPaste.app
            os_arch: darwin_aarch64
            kind: dmg
          - id: mac-x64
            os: macos-latest
            platform: darwin/amd64
            task: darwin:package ARCH=amd64
            output: GoPaste.app
            os_arch: darwin_x64
            kind: dmg
          - id: mac-universal
            os: macos-latest
            platform: darwin/universal
            task: darwin:package:universal
            output: GoPaste.app
            os_arch: darwin_universal
            kind: dmg

          # ===== Windows =====
          # x64：同时输出 portable + setup（windows:package = 构建 + NSIS 安装包）
          - id: win-x64
            os: windows-latest
            platform: windows/amd64
            task: windows:package ARCH=amd64
            output: GoPaste.exe
            os_arch: windows_x64
            kind: win
            nsis: 'yes'
          # x86 (32 位)：仅输出 portable（Wails 官方 NSIS 模板不支持 386）。
          # 注意：Wails v3 官方支持列表只有 amd64/arm64，386 能编译通过但属于非官方架构，
          # 每次升级 v3 后需在 32 位 Windows 上实机回归。
          - id: win-x86
            os: windows-latest
            platform: windows/386
            task: windows:build ARCH=386
            output: GoPaste.exe
            os_arch: windows_x86
            kind: win
            nsis: 'no'

          # ===== Linux =====
          - id: linux-x64
            os: ubuntu-latest
            platform: linux/amd64
            task: linux:build ARCH=amd64
            output: GoPaste
            os_arch: linux_x64
            kind: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 确保 annotated tag 对象被下载，否则
          # shallow clone 下 git tag --format='%(contents)' 拿不到
          # tag message，Release notes 会变成空。
          fetch-depth: 0

      # Wails v3 要求 Go ≥ 1.26；版本与 go.mod 的 toolchain 指令保持一致
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------- Linux 依赖 ----------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Wails v3 默认 GTK4 + WebKitGTK 6.0（GTK3 只能用 -tags gtk3 回退，且只保留到 v3.1）。
          # libx11/libxtst/libxrandr 是 golang.design/x/hotkey、x/clipboard 与模拟粘贴需要的。
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev libxtst-dev libxrandr-dev

      # ---------- macOS 依赖：create-dmg ----------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # ---------- Windows 依赖：NSIS（仅需要打安装包的 job）----------
      - name: Install NSIS (Windows)
        if: matrix.nsis == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub Windows runner 默认未安装 NSIS；wails3 task windows:package 找不到 makensis 会直接失败
          choco install nsis -y --no-progress
          # 把 NSIS 加入 PATH，使后续步骤的 wails3 task / bash 能调用 makensis
          $nsisPath = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            # 有些 chocolatey 版本装到 C:\Program Files\NSIS
            $nsisPath = 'C:\Program Files\NSIS'
          }
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            Write-Host "Searching for makensis.exe ..."
            Get-ChildItem -Path 'C:\','D:\' -Filter 'makensis.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
            throw "makensis.exe not found"
          }
          # 用 ASCII 追加，避免 BOM 导致 GitHub Actions 解析失败
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath -Encoding ASCII
          Write-Host "NSIS added to PATH: $nsisPath"
          & (Join-Path $nsisPath 'makensis.exe') /VERSION

      # ---------- Wails CLI ----------
      # 版本必须与 go.mod 中 github.com/wailsapp/wails/v3 一致；v3 每周发 minor，禁止 @latest
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      # ---------- 解析版本号 ----------
      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ---------- 构建 ----------
      - name: Wails version
        shell: bash
        run: wails3 version

      # 构建 / 打包统一走 Taskfile（build/<os>/Taskfile.yml）：
      #   npm install → wails3 generate bindings → 前端构建 → (Windows) syso → go build -tags production
      #   → (mac) .app + ad-hoc 签名 / (Windows x64) NSIS 安装包
      # VERSION 覆盖根 Taskfile 的默认值（wails.json），注入 internal/updater.Version。
      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.nsis }}" = "yes" ]; then command -v makensis; fi
          wails3 task ${{ matrix.task }} VERSION=${VERSION}

      - name: List build output
        shell: bash
        run: |
          echo "--- build/bin ---"
          ls -la build/bin/ || true
          echo "--- build/bin/* (recursive) ---"
          find build/bin -maxdepth 3 -type f 2>/dev/null || true

      # ---------- 打包产物 ----------
      - name: Package macOS (dmg)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          set -e
          cd build/bin
          DMG="GoPaste_${VERSION}_${{ matrix.os_arch }}.dmg"
          create-dmg \
            --volname "GoPaste ${VERSION}" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ matrix.output }}" 150 200 \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "$DMG" "${{ matrix.output }}" || {
              # create-dmg 偶发返回非 0 但 dmg 已生成，做兜底
              [ -f "$DMG" ] || exit 1
            }
          # 清理原始 .app，避免被后续步骤误上传
          rm -rf "${{ matrix.output }}"
          ls -la

      - name: Package Windows (portable + setup)
        if: matrix.kind == 'win'
        shell: bash
        run: |
          set -e
          cd build/bin
          PORTABLE="GoPaste_${VERSION}_${{ matrix.os_arch }}-portable.exe"
          mv "${{ matrix.output }}" "$PORTABLE"
          echo "PORTABLE=$PORTABLE" >> $GITHUB_ENV

          if [ "${{ matrix.nsis }}" = "yes" ]; then
            # Wails v3 NSIS 模板输出 build/bin/GoPaste-amd64-installer.exe（见 build/windows/nsis/project.nsi）
            INSTALLER_SRC=""
            for f in GoPaste-amd64-installer.exe gopaste-amd64-installer.exe GoPaste-arm64-installer.exe gopaste-arm64-installer.exe GoPaste-*-installer.exe gopaste-*-installer.exe; do
              if [ -f "$f" ]; then INSTALLER_SRC="$f"; break; fi
            done
            if [ -z "$INSTALLER_SRC" ]; then
              echo "::error::NSIS installer not found in build/bin"
              exit 1
            fi
            SETUP="GoPaste_${VERSION}_${{ matrix.os_arch }}-setup.exe"
            mv "$INSTALLER_SRC" "$SETUP"
            echo "SETUP=$SETUP" >> $GITHUB_ENV
          fi
          ls -la

      - name: Package Linux (tar.gz)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -e
          cd build/bin
          BIN="${{ matrix.output }}"
          TARBALL="GoPaste_${VERSION}_${{ matrix.os_arch }}.tar.gz"
          chmod +x "$BIN"
          tar -czvf "$TARBALL" "$BIN"
          rm -f "$BIN"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ls -la

      # ---------- 直接上传到 GitHub Release（仅 tag push）----------
      # 跳过 Actions Artifact 中转，避免触碰 500MB 存储配额。
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          cd build/bin
          FILES=$(ls GoPaste_*_* 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::No artifacts matched GoPaste_*_*"
            exit 1
          fi
          echo "Uploading to release $TAG:"
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber
