name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output: gopaste.exe
          - os: macos-latest
            platform: darwin/arm64
            output: gopaste
          - os: macos-latest
            platform: darwin/amd64
            output: gopaste
          - os: ubuntu-latest
            platform: linux/amd64
            output: gopaste

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Linux 依赖
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            xvfb
          # Wails v2 查找 webkit2gtk-4.0，Ubuntu 24.04 只有 4.1，创建别名
          if ! pkg-config --exists webkit2gtk-4.0 && pkg-config --exists webkit2gtk-4.1; then
            pc=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
            sudo ln -sf "$pc/webkit2gtk-4.1.pc" "$pc/webkit2gtk-4.0.pc"
          fi

      # 安装 Wails CLI
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 启动虚拟帧缓冲（Linux 需要 DISPLAY 才能初始化 X11）
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99.0" >> $GITHUB_ENV

      # 构建
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}

      # 列出产物目录（便于调试）
      - name: List build output
        shell: bash
        run: ls -la build/bin/ || true

      # 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopaste-${{ matrix.platform == 'windows/amd64' && 'windows-amd64' || matrix.platform == 'darwin/arm64' && 'macos-arm64' || matrix.platform == 'darwin/amd64' && 'macos-amd64' || 'linux-amd64' }}
          path: build/bin/${{ matrix.output }}
          if-no-files-found: warn

      # 发布到 Release（仅 tag 触发时）
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.output }}
