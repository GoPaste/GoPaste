name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===================================================================
  # create-release: 提前创建（或重建）空 Release，供各 build job 直接上传。
  # 只在 tag push 时运行；workflow_dispatch 时跳过（无 tag，无需 release）。
  # ===================================================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing Release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true

      - name: Create empty Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES_FILE="changelog/release_notes_v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "" \
              --draft=false
          fi

  build:
    # tag push 时等待 release 创建完成；workflow_dispatch 时直接运行
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== macOS =====
          - id: mac-arm64
            os: macos-latest
            platform: darwin/arm64
            output: GoPaste.app
            os_arch: darwin_aarch64
            kind: dmg
          - id: mac-x64
            os: macos-latest
            platform: darwin/amd64
            output: GoPaste.app
            os_arch: darwin_x64
            kind: dmg
          - id: mac-universal
            os: macos-latest
            platform: darwin/universal
            output: GoPaste.app
            os_arch: darwin_universal
            kind: dmg

          # ===== Windows =====
          # x64：同时输出 portable + setup
          - id: win-x64
            os: windows-latest
            platform: windows/amd64
            output: GoPaste.exe
            os_arch: windows_x64
            kind: win
            nsis: 'yes'
          # x86 (32 位)：仅输出 portable（Wails 官方 NSIS 模板不支持 386）
          - id: win-x86
            os: windows-latest
            platform: windows/386
            output: GoPaste.exe
            os_arch: windows_x86
            kind: win
            nsis: 'no'

          # ===== Linux =====
          - id: linux-x64
            os: ubuntu-latest
            platform: linux/amd64
            output: GoPaste
            os_arch: linux_x64
            kind: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 确保 annotated tag 对象被下载，否则
          # shallow clone 下 git tag --format='%(contents)' 拿不到
          # tag message，Release notes 会变成空。
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------- Linux 依赖 ----------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            xvfb
          # Wails v2 查找 webkit2gtk-4.0，Ubuntu 24.04 只有 4.1，创建别名
          if ! pkg-config --exists webkit2gtk-4.0 && pkg-config --exists webkit2gtk-4.1; then
            pc=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
            sudo ln -sf "$pc/webkit2gtk-4.1.pc" "$pc/webkit2gtk-4.0.pc"
          fi

      # ---------- macOS 依赖：create-dmg ----------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # ---------- Windows 依赖：NSIS（仅需要打安装包的 job）----------
      - name: Install NSIS (Windows)
        if: matrix.nsis == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub Windows runner 默认未安装 NSIS，wails 找不到 makensis 会静默跳过 NSIS 打包
          choco install nsis -y --no-progress
          # 把 NSIS 加入 PATH，使后续步骤的 wails/bash 能调用 makensis
          $nsisPath = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            # 有些 chocolatey 版本装到 C:\Program Files\NSIS
            $nsisPath = 'C:\Program Files\NSIS'
          }
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            Write-Host "Searching for makensis.exe ..."
            Get-ChildItem -Path 'C:\','D:\' -Filter 'makensis.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
            throw "makensis.exe not found"
          }
          # 用 ASCII 追加，避免 BOM 导致 GitHub Actions 解析失败
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath -Encoding ASCII
          Write-Host "NSIS added to PATH: $nsisPath"
          & (Join-Path $nsisPath 'makensis.exe') /VERSION

      # ---------- Wails CLI ----------
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ---------- Linux 虚拟显示 ----------
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99.0" >> $GITHUB_ENV

      # ---------- 解析版本号 ----------
      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ---------- 构建 ----------
      - name: Wails version
        shell: bash
        run: wails version

      - name: Build (with NSIS)
        if: matrix.nsis == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          command -v makensis
          wails build -clean -platform ${{ matrix.platform }} -nsis \
            -ldflags "-s -w -X gopaste/internal/updater.Version=${VERSION}"

      - name: Build
        if: matrix.nsis != 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          wails build -clean -platform ${{ matrix.platform }} \
            -ldflags "-s -w -X gopaste/internal/updater.Version=${VERSION}"

      - name: List build output
        shell: bash
        run: |
          echo "--- build/bin ---"
          ls -la build/bin/ || true
          echo "--- build/bin/* (recursive) ---"
          find build/bin -maxdepth 3 -type f 2>/dev/null || true

      # ---------- 打包产物 ----------
      - name: Package macOS (dmg)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          set -e
          cd build/bin
          DMG="GoPaste_${VERSION}_${{ matrix.os_arch }}.dmg"
          create-dmg \
            --volname "GoPaste ${VERSION}" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ matrix.output }}" 150 200 \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "$DMG" "${{ matrix.output }}" || {
              # create-dmg 偶发返回非 0 但 dmg 已生成，做兜底
              [ -f "$DMG" ] || exit 1
            }
          # 清理原始 .app，避免被后续步骤误上传
          rm -rf "${{ matrix.output }}"
          ls -la

      - name: Package Windows (portable + setup)
        if: matrix.kind == 'win'
        shell: bash
        run: |
          set -e
          cd build/bin
          PORTABLE="GoPaste_${VERSION}_${{ matrix.os_arch }}-portable.exe"
          mv "${{ matrix.output }}" "$PORTABLE"
          echo "PORTABLE=$PORTABLE" >> $GITHUB_ENV

          if [ "${{ matrix.nsis }}" = "yes" ]; then
            # Wails 默认输出 GoPaste-amd64-installer.exe / gopaste-amd64-installer.exe
            INSTALLER_SRC=""
            for f in GoPaste-amd64-installer.exe gopaste-amd64-installer.exe GoPaste-arm64-installer.exe gopaste-arm64-installer.exe GoPaste-*-installer.exe gopaste-*-installer.exe; do
              if [ -f "$f" ]; then INSTALLER_SRC="$f"; break; fi
            done
            if [ -z "$INSTALLER_SRC" ]; then
              echo "::error::NSIS installer not found in build/bin"
              exit 1
            fi
            SETUP="GoPaste_${VERSION}_${{ matrix.os_arch }}-setup.exe"
            mv "$INSTALLER_SRC" "$SETUP"
            echo "SETUP=$SETUP" >> $GITHUB_ENV
          fi
          ls -la

      - name: Package Linux (tar.gz)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -e
          cd build/bin
          BIN="${{ matrix.output }}"
          TARBALL="GoPaste_${VERSION}_${{ matrix.os_arch }}.tar.gz"
          chmod +x "$BIN"
          tar -czvf "$TARBALL" "$BIN"
          rm -f "$BIN"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ls -la

      # ---------- 直接上传到 GitHub Release（仅 tag push）----------
      # 跳过 Actions Artifact 中转，避免触碰 500MB 存储配额。
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          cd build/bin
          FILES=$(ls GoPaste_*_* 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::No artifacts matched GoPaste_*_*"
            exit 1
          fi
          echo "Uploading to release $TAG:"
          echo "$FILES"
          gh release upload "$TAG" $FILES --clobber
