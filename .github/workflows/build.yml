name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output: gopaste.exe
            arch: x64
          - os: macos-latest
            platform: darwin/arm64
            output: GoPaste.app
            arch: aarch64
          - os: macos-latest
            platform: darwin/amd64
            output: GoPaste.app
            arch: x64
          - os: ubuntu-latest
            platform: linux/amd64
            output: gopaste
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Linux 依赖
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            xvfb
          # Wails v2 查找 webkit2gtk-4.0，Ubuntu 24.04 只有 4.1，创建别名
          if ! pkg-config --exists webkit2gtk-4.0 && pkg-config --exists webkit2gtk-4.1; then
            pc=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
            sudo ln -sf "$pc/webkit2gtk-4.1.pc" "$pc/webkit2gtk-4.0.pc"
          fi

      # 安装 Wails CLI
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 启动虚拟帧缓冲（Linux 需要 DISPLAY 才能初始化 X11）
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99.0" >> $GITHUB_ENV

      # 构建
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}${{ matrix.os == 'windows-latest' && ' -nsis' || '' }}

      # 列出产物目录（便于调试）
      - name: List build output
        shell: bash
        run: ls -la build/bin/ || true

      # 解析版本号（去掉 v 前缀，workflow_dispatch 时用 dev）
      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 重命名产物为带版本号和架构的文件名
      - name: Rename artifact
        shell: bash
        run: |
          VERSION=${{ env.VERSION }}
          cd build/bin
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r "GoPaste_${VERSION}_${{ matrix.arch }}.zip" "${{ matrix.output }}"
            echo "ARTIFACT=GoPaste_${VERSION}_${{ matrix.arch }}.zip" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "Windows" ]; then
            mv "${{ matrix.output }}" "GoPaste_${VERSION}_${{ matrix.arch }}.exe"
            echo "ARTIFACT=GoPaste_${VERSION}_${{ matrix.arch }}.exe" >> $GITHUB_ENV
            # NSIS 安装包（如果存在）
            INSTALLER="gopaste-amd64-installer.exe"
            if [ -f "$INSTALLER" ]; then
              mv "$INSTALLER" "GoPaste_${VERSION}_${{ matrix.arch }}-setup.exe"
              echo "INSTALLER=GoPaste_${VERSION}_${{ matrix.arch }}-setup.exe" >> $GITHUB_ENV
            fi
          else
            mv "${{ matrix.output }}" "GoPaste_${VERSION}_${{ matrix.arch }}"
            echo "ARTIFACT=GoPaste_${VERSION}_${{ matrix.arch }}" >> $GITHUB_ENV
          fi

      # 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: build/bin/${{ env.ARTIFACT }}
          if-no-files-found: warn

      # 发布到 Release（仅 tag 触发时）
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/${{ env.ARTIFACT }}
            ${{ env.INSTALLER && format('build/bin/{0}', env.INSTALLER) || '' }}
