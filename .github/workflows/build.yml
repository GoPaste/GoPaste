name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== macOS =====
          - id: mac-arm64
            os: macos-latest
            platform: darwin/arm64
            output: GoPaste.app
            os_arch: darwin_aarch64
            kind: dmg
          - id: mac-x64
            os: macos-latest
            platform: darwin/amd64
            output: GoPaste.app
            os_arch: darwin_x64
            kind: dmg
          - id: mac-universal
            os: macos-latest
            platform: darwin/universal
            output: GoPaste.app
            os_arch: darwin_universal
            kind: dmg

          # ===== Windows =====
          # x64：同时输出 portable + setup
          - id: win-x64
            os: windows-latest
            platform: windows/amd64
            output: gopaste.exe
            os_arch: windows_x64
            kind: win
            nsis: 'yes'
          # x86 (32 位)：仅输出 portable（Wails 官方 NSIS 模板不支持 386）
          - id: win-x86
            os: windows-latest
            platform: windows/386
            output: gopaste.exe
            os_arch: windows_x86
            kind: win
            nsis: 'no'

          # ===== Linux =====
          - id: linux-x64
            os: ubuntu-latest
            platform: linux/amd64
            output: gopaste
            os_arch: linux_x64
            kind: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------- Linux 依赖 ----------
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            xvfb
          # Wails v2 查找 webkit2gtk-4.0，Ubuntu 24.04 只有 4.1，创建别名
          if ! pkg-config --exists webkit2gtk-4.0 && pkg-config --exists webkit2gtk-4.1; then
            pc=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
            sudo ln -sf "$pc/webkit2gtk-4.1.pc" "$pc/webkit2gtk-4.0.pc"
          fi

      # ---------- macOS 依赖：create-dmg ----------
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # ---------- Windows 依赖：NSIS（仅需要打安装包的 job）----------
      - name: Install NSIS (Windows)
        if: matrix.nsis == 'yes'
        shell: pwsh
        run: |
          # GitHub Windows runner 默认未安装 NSIS，wails 找不到 makensis 会静默跳过 NSIS 打包
          choco install nsis -y --no-progress
          # 把 NSIS 加入 PATH，使后续步骤的 bash 能调用 makensis
          $nsisPath = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsisPath) {
            echo $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "NSIS added to PATH: $nsisPath"
          }
          & "$nsisPath\makensis.exe" /VERSION

      # ---------- Windows 32 位编译器：mingw-w64 i686 ----------
      # 项目依赖 github.com/emersion/go-autostart 在 windows 平台使用 cgo，
      # 编译 windows/386 必须使用 32 位 mingw 工具链 + CGO_ENABLED=1。
      # 重要：wails v2 在 windows 平台不会自动设置 CGO_ENABLED=1（见 wails base.go line 305），
      # 需要我们手动在 build 命令前导出环境变量。
      - name: Setup MSYS2 (Windows 32-bit)
        if: matrix.platform == 'windows/386'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-gcc
          path-type: inherit
          update: false

      - name: Configure 32-bit toolchain (Windows 32-bit)
        if: matrix.platform == 'windows/386'
        shell: bash
        run: |
          set -euxo pipefail
          # 找到 MSYS2 安装的 mingw32 工具目录
          for p in "/d/a/_temp/msys64/mingw32/bin" "/c/msys64/mingw32/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              echo "Added to PATH: $p"
              # 验证 i686 gcc 可用
              "$p/i686-w64-mingw32-gcc.exe" --version || "$p/gcc.exe" --version
              break
            fi
          done

      # ---------- Wails CLI ----------
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ---------- Linux 虚拟显示 ----------
      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99.0" >> $GITHUB_ENV

      # ---------- 解析版本号 ----------
      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ---------- 构建 ----------
      - name: Wails version
        shell: bash
        run: wails version

      - name: Build (with NSIS)
        if: matrix.nsis == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          wails build -clean -platform ${{ matrix.platform }} -nsis

      # windows/386 需要 CGO + 32 位工具链（go-autostart 依赖 cgo）
      - name: Build (Windows 32-bit, CGO)
        if: matrix.platform == 'windows/386'
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: '386'
          CC: i686-w64-mingw32-gcc
          CXX: i686-w64-mingw32-g++
        run: |
          set -euxo pipefail
          which i686-w64-mingw32-gcc || true
          i686-w64-mingw32-gcc --version || true
          go env GOOS GOARCH CGO_ENABLED CC
          wails build -clean -platform ${{ matrix.platform }}

      - name: Build (no NSIS, no CGO)
        if: matrix.nsis != 'yes' && matrix.platform != 'windows/386'
        shell: bash
        run: |
          set -euxo pipefail
          wails build -clean -platform ${{ matrix.platform }}

      - name: List build output
        shell: bash
        run: |
          echo "--- build/bin ---"
          ls -la build/bin/ || true
          echo "--- build/bin/* (recursive) ---"
          find build/bin -maxdepth 3 -type f 2>/dev/null || true

      # ---------- 打包产物 ----------
      - name: Package macOS (dmg)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          set -e
          cd build/bin
          DMG="GoPaste_${VERSION}_${{ matrix.os_arch }}.dmg"
          create-dmg \
            --volname "GoPaste ${VERSION}" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ matrix.output }}" 150 200 \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "$DMG" "${{ matrix.output }}" || {
              # create-dmg 偶发返回非 0 但 dmg 已生成，做兜底
              [ -f "$DMG" ] || exit 1
            }
          # 清理原始 .app，避免被后续步骤误上传
          rm -rf "${{ matrix.output }}"
          ls -la

      - name: Package Windows (portable + setup)
        if: matrix.kind == 'win'
        shell: bash
        run: |
          set -e
          cd build/bin
          PORTABLE="GoPaste_${VERSION}_${{ matrix.os_arch }}-portable.exe"
          mv "${{ matrix.output }}" "$PORTABLE"
          echo "PORTABLE=$PORTABLE" >> $GITHUB_ENV

          if [ "${{ matrix.nsis }}" = "yes" ]; then
            # Wails 默认输出 gopaste-amd64-installer.exe / gopaste-arm64-installer.exe
            INSTALLER_SRC=""
            for f in gopaste-amd64-installer.exe gopaste-arm64-installer.exe gopaste-*-installer.exe; do
              if [ -f "$f" ]; then INSTALLER_SRC="$f"; break; fi
            done
            if [ -z "$INSTALLER_SRC" ]; then
              echo "::error::NSIS installer not found in build/bin"
              exit 1
            fi
            SETUP="GoPaste_${VERSION}_${{ matrix.os_arch }}-setup.exe"
            mv "$INSTALLER_SRC" "$SETUP"
            echo "SETUP=$SETUP" >> $GITHUB_ENV
          fi
          ls -la

      - name: Package Linux (tar.gz)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -e
          cd build/bin
          BIN="gopaste"
          TARBALL="GoPaste_${VERSION}_${{ matrix.os_arch }}.tar.gz"
          chmod +x "$BIN"
          tar -czvf "$TARBALL" "$BIN"
          rm -f "$BIN"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ls -la

      # ---------- 收集要上传的文件清单 ----------
      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          cd build/bin
          # 仅收集规范命名的产物，避免任何残留被上传
          FILES=$(ls GoPaste_*_* 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::No artifacts matched GoPaste_*_*"
            exit 1
          fi
          echo "Files to upload:"
          echo "$FILES"

      # ---------- 上传到 Actions Artifact ----------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPaste-${{ matrix.id }}-${{ env.VERSION }}
          path: build/bin/GoPaste_*_*
          if-no-files-found: error

      # ---------- 发布到 Release（仅 tag 触发） ----------
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: build/bin/GoPaste_*_*
